  <style>
    .notif-row {
      display:flex; gap:0.9rem; padding:1rem 1.25rem; border-bottom:1px solid var(--border-light);
      align-items:flex-start;
    }
    .notif-row.unread { background:var(--primary-light); }
    .notif-row-icon {
      width:38px; height:38px; border-radius:50%; background:var(--page-bg);
      display:flex; align-items:center; justify-content:center; flex-shrink:0;
    }
    .notif-row-title { font-weight:600; font-size:0.92rem; color:var(--text-dark); }
    .notif-row-msg { font-size:0.85rem; color:var(--text-muted); margin-top:2px; }
    .notif-row-time { font-size:0.75rem; color:var(--text-light); margin-top:6px; }
    .type-tag {
      font-size:0.68rem; font-weight:700; padding:0.15rem 0.55rem; border-radius:20px;
      background:var(--page-bg); color:var(--text-muted); text-transform:capitalize;
    }
    .notif-row-actions { display:flex; gap:0.4rem; margin-left:auto; flex-shrink:0; }
  </style>
</head>

      <div class="nav-item">
        <a href="patients.html" class="nav-link">

          <span class="nav-label">Patients</span>
        </a>
      </div>
      <div class="sidebar-section-label">Management</div>

  <!-- Main Content -->

    <div class="card">
      <div class="table-toolbar">
        <div style="display:flex;gap:0.5rem">

          <button class="btn btn-secondary btn-sm filter-tab" data-filter="unread">Unread</button>

        <div class="toolbar-actions">
          <button class="btn btn-secondary btn-sm" id="refreshNotifBtn"><i class="fa-solid fa-rotate-right"></i></button>
        </div>
      </div>
      <div id="notifListFull">
        <div class="empty-state" style="padding:2rem 0"><div class="spinner-sm" style="margin:0 auto"></div></div>

<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/utils.js"></script>
<script src="../../assets/js/sidebar.js"></script>
<script src="../../assets/js/notifications-widget.js"></script>
<script>
  requireAuth('admin');

  let currentPage = 1;
  let unreadOnly  = false;

  const typeMeta = {
    patient_flow: { icon: 'fa-layer-group', color: 'var(--primary)' },
    lab_result:   { icon: 'fa-flask',        color: '#e67e22' },
    low_stock:    { icon: 'fa-triangle-exclamation', color: 'var(--danger)' },
    system:       { icon: 'fa-gear',         color: 'var(--text-muted)' },
    general:      { icon: 'fa-bell',         color: 'var(--text-muted)' },
  };

  // Admin doesn't have role pages that most reference_types would deep-link
  // to (e.g. lab_result -> laboratory.html doesn't exist here), so, unlike
  // the Doctor version this was adapted from, notifications are marked read
  // on click but never navigate anywhere.
  function getNotificationLink(n) {
    return null;
  }

  async function loadNotifications() {
    const list = document.getElementById('notifListFull');
    list.innerHTML = '<div class="empty-state" style="padding:2rem 0"><div class="spinner-sm" style="margin:0 auto"></div></div>';

    try {
      const res = await api.get(`/notifications?page=${currentPage}&per_page=20&unread_only=${unreadOnly}`);
      const notifs = res.data.notifications || [];
      const pages  = res.data.pages || 1;

      if (!notifs.length) {
        list.innerHTML = `<div class="empty-state" style="padding:2rem 0"><i class="fa-solid fa-bell-slash"></i><h4>No notifications</h4><p>${unreadOnly ? "You're all caught up" : 'Nothing here yet'}</p></div>`;
        document.getElementById('notifPagination').innerHTML = '';
        return;
      }

      list.innerHTML = notifs.map(n => {
        const meta = typeMeta[n.notification_type] || typeMeta.general;
        return `
          <div class="notif-row ${n.is_read ? '' : 'unread'}" id="notifRow${n.id}">
            <div class="notif-row-icon"><i class="fa-solid ${meta.icon}" style="color:${meta.color}"></i></div>
            <div style="flex:1;min-width:0">
              <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap">
                <span class="notif-row-title">${n.title}</span>
                <span class="type-tag">${n.notification_type.replace('_',' ')}</span>
              </div>
              <div class="notif-row-msg">${n.message}</div>
              <div class="notif-row-time">${timeAgo(n.created_at)}</div>
            </div>
            <div class="notif-row-actions">
              ${!n.is_read ? `<button class="btn btn-secondary btn-sm" onclick="markOne(${n.id})" title="Mark as read"><i class="fa-solid fa-check"></i></button>` : ''}
              <button class="btn btn-secondary btn-sm" onclick="deleteOne(${n.id})" title="Delete"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>`;
      }).join('');

      renderPagination(currentPage, pages);

    } catch (err) {
      list.innerHTML = `<div class="empty-state" style="padding:2rem 0"><i class="fa-solid fa-circle-exclamation" style="color:var(--danger)"></i><h4>Failed to load</h4><p>${err.message}</p></div>`;
    }
  }

  function renderPagination(current, total) {
    const c = document.getElementById('notifPagination');
    if (total <= 1) { c.innerHTML = ''; return; }
    let html = `<button class="page-btn" onclick="goPage(${current-1})" ${current===1?'disabled':''}><i class="fa-solid fa-chevron-left"></i></button>`;
    for (let i = 1; i <= total; i++) {
      if (i===1||i===total||(i>=current-1&&i<=current+1))
        html += `<button class="page-btn ${i===current?'active':''}" onclick="goPage(${i})">${i}</button>`;
      else if (i===current-2||i===current+2)
        html += `<span style="padding:0 4px;color:var(--text-light)">…</span>`;
    }
    html += `<button class="page-btn" onclick="goPage(${current+1})" ${current===total?'disabled':''}><i class="fa-solid fa-chevron-right"></i></button>`;
    c.innerHTML = html;
  }
  function goPage(p) { currentPage = p; loadNotifications(); }

  document.querySelectorAll('.filter-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      unreadOnly = tab.dataset.filter === 'unread';
      currentPage = 1;
      loadNotifications();
    });
  });
  document.getElementById('refreshNotifBtn').addEventListener('click', loadNotifications);

  async function markOne(id) {
    try {
      await api.patch(`/notifications/${id}/read`);
      loadNotifications();
    } catch (err) { showToast(err.message, 'error'); }
  }
  async function deleteOne(id) {
    if (!confirm('Delete this notification?')) return;
    try {
      await api.delete(`/notifications/${id}`);
      loadNotifications();
    } catch (err) { showToast(err.message, 'error'); }
  }
  document.getElementById('markAllBtn').addEventListener('click', async () => {
    try {
      await api.patch('/notifications/read-all');
      showToast('All notifications marked as read.', 'success');
      loadNotifications();
    } catch (err) { showToast(err.message, 'error'); }
  });

  loadNotifications();
</script>
</body>
</html>
